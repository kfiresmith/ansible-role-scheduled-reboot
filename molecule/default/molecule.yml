provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        reboot_schedule: 50 5 * * *
        reboot_schedule_timer: '*-*-* 05:50:00'
        scheduled_reboot_cronjob_state: absent
        scheduled_reboot_email_when_disabled: true
        scheduled_reboot_mailto: root
        scheduled_reboot_package_state: present
verifier:
  name: ansible
scenario:
  test_sequence:
  - dependency
  - create
  - prepare
  - converge
  - idempotence
  - verify
  - destroy
