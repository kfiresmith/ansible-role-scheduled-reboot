---

# The package module picks the host's own manager: yum on EL 7 (Python 2.7/3.6,
# no python3-dnf, so ansible.builtin.dnf cannot run there) and dnf on EL 8+.
- name: Install scheduled-reboot rpm package
  ansible.builtin.package:
    name: scheduled-reboot
    state: "{{ scheduled_reboot_package_state }}"
