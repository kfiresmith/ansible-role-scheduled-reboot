---
# defaults file for scheduled-reboot

scheduled_reboot_cronjob_state: absent

scheduled_reboot_mailto: root

scheduled_reboot_package_state: present

scheduled_reboot_post_reboot_service_enabled: true

# Restore /etc/default/scheduled-reboot to the package's pristine copy when its
# only local edits are settings this role now writes to local.conf.
scheduled_reboot_restore_conffile: true

# Unmodified copy of the defaults file shipped by scheduled-reboot >= 0.56.
# Its presence is also how the role knows the package reads local.conf.
scheduled_reboot_reference_conffile: /usr/local/share/scheduled-reboot/default.conf
